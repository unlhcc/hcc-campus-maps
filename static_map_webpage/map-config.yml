# Map Configuration

# GeoJSON data source
buildings_geojson_url: "buildings.geojson"
departments_using_hcc_url: "departments_completing_jobs.json"

# Map initialization settings
map:
  center:
    lat: 40.825
    lng: -96.682
  zoom: 15
  # Initial view and the "All" campus button: frame City, Innovation, and East campuses
  # ([south, west], [north, east]), leaving room for the title card. Remove to use center/zoom instead.
  fit_bounds:
    - [40.8147, -96.7080]
    - [40.8358, -96.6562]

# Campuses, in order. A building belongs to the first campus whose area contains its center.
# Each campus gets a zoom button on the map (unless switcher is false) and a group in the
# Buildings list. The button frames that campus's buildings, not the whole area.
campuses:
  - name: City Campus
    label: City
    area:
      - [40.8120, -96.7120]
      - [40.8262, -96.6880]
  - name: East Campus
    label: East
    area:
      - [40.8260, -96.6760]
      - [40.8400, -96.6540]
  - name: Innovation Campus
    label: Innovation
    area:
      - [40.8262, -96.6980]
      - [40.8400, -96.6880]
  - name: Omaha
    label: Omaha
    # About 50 miles from Lincoln, so it's only in the Buildings list
    switcher: false
    area:
      - [41.0000, -96.3000]
      - [41.5000, -95.7000]

# Days of job history behind departments_completing_jobs.json (LOOKBACK_DAYS in
# scripts/publish_departments.sh); only used for wording on the page
usage_window_days: 365

# Refresh interval in milliseconds (6 hours = 21600000 ms)
refresh_interval: 21600000

# Base layers to include (campus, streets, satellite, topo).
# "campus" is OpenStreetMap desaturated so the buildings stand out.
base_layers:
  - campus
  - streets
  - satellite
  - topo

# Default base layer
default_layer: campus

# Building styling
styling:
  # Buildings that use HCC
  # (UNL scarlet; keep --scarlet/--stone in index.css in step for the legend and popups)
  with_hcc:
    fill_color: "#D00000"
    fill_opacity: 0.85
    stroke_color: "#8A0000"
    stroke_weight: 1
    # Zoomed out, most buildings are only a few pixels wide. Below this zoom a scarlet outline,
    # up to grow_max_weight pixels, grows them so they read (and click) as more than specks.
    grow_below_zoom: 16
    grow_max_weight: 3

  # Buildings that don't use HCC
  without_hcc:
    fill_color: "#B8B1A5"
    fill_opacity: 0.6
    stroke_color: "#8F887C"
    stroke_weight: 1

  # Hovered or selected building
  hover:
    fill_opacity_boost: 0.15
    extra_stroke_weight: 1.5

# Department filtering
departments:
  # Departments to exclude from the map entirely
  excluded:
    - "Parking and Transit Services"
    - "Facilities Management"
    - "Housing"
    - "Family Housing"
    - "University Libraries"
    - "Dining Services"
    - "Campus Recreation"
    - "Athletics"
    - "Administration"
# Display settings
display:
  show_buildings_without_departments: false
  show_buildings_not_using_hcc: true

  show_layers_control: false
  
  # Properties to display in feature popup (in order)
  popup_properties:
    - name
    - abbrev
    - departments

show_usage_stats_in_console: true

# Embed mode (for iframes, e.g. on hcc.unl.edu): scroll-wheel zoom and one-finger touch panning
# stay off until the map is clicked/tapped, and an "Open full map" link is shown.
# Force it with ?embed=1 or ?embed=0 in the URL.
embed:
  auto_detect_iframe: true